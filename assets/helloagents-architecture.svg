<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
  <title id="title">HelloAgents 模块架构图</title>
  <desc id="desc">展示 Core 基础能力、Agent 智能体层和 Tool 工具系统三部分，以及 Message、Config、LLM、Agent 和工具注册表之间的关系。</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&amp;family=ZCOOL+KuaiLe&amp;display=swap');
      text { font-family: 'Ma Shan Zheng', 'ZCOOL KuaiLe', 'STKaiti', 'KaiTi', cursive; }
      .label-en { font-family: 'Comic Sans MS', 'Segoe Print', 'Bradley Hand', cursive, sans-serif; }
    </style>
    <filter id="sketchy" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="turbulence" baseFrequency="0.025" numOctaves="4" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="11" stdDeviation="11" flood-color="#17233c" flood-opacity="0.11"/>
    </filter>

    <pattern id="hatch-blue" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#84b8e9" stroke-width="1.5" opacity="0.30"/>
    </pattern>
    <pattern id="hatch-purple" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#b7a2e9" stroke-width="1.5" opacity="0.30"/>
    </pattern>
    <pattern id="hatch-green" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#79bd9b" stroke-width="1.5" opacity="0.30"/>
    </pattern>

    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 2 2 L 10 6 L 2 10 Z" fill="#347eb8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 2 2 L 10 6 L 2 10 Z" fill="#7654b5"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 2 2 L 10 6 L 2 10 Z" fill="#2d8a55"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 2 2 L 10 6 L 2 10 Z" fill="#24324a"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#fbfaf6"/>
  <text x="70" y="78" class="label-en" font-size="22" font-weight="700" fill="#7654b5" letter-spacing="3">HELLO AGENTS · INSIDE THE FRAMEWORK</text>
  <text x="70" y="148" font-size="56" font-weight="700" fill="#17233c">一个 Agent，是怎样被组装起来的？</text>
  <text x="72" y="196" font-size="24" fill="#5f6b7d">统一接口让模型、记忆与工具各司其职，也让下一种 Agent 更容易诞生</text>

  <rect x="1215" y="74" width="315" height="62" rx="25" fill="#17233c" filter="url(#sketchy)"/>
  <text x="1372" y="113" text-anchor="middle" class="label-en" font-size="18" font-weight="700" fill="#ffffff">CORE · AGENT · TOOL</text>

  <!-- Major containers -->
  <g filter="url(#shadow)">
    <rect x="55" y="250" width="430" height="500" rx="30" fill="#edf7ff" stroke="#347eb8" stroke-width="4" filter="url(#sketchy)"/>
    <rect x="55" y="250" width="430" height="500" rx="30" fill="url(#hatch-blue)" opacity="0.52"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="555" y="226" width="590" height="548" rx="34" fill="#f4efff" stroke="#7654b5" stroke-width="4" filter="url(#sketchy)"/>
    <rect x="555" y="226" width="590" height="548" rx="34" fill="url(#hatch-purple)" opacity="0.52"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="1215" y="250" width="330" height="500" rx="30" fill="#ecf9f1" stroke="#2d8a55" stroke-width="4" filter="url(#sketchy)"/>
    <rect x="1215" y="250" width="330" height="500" rx="30" fill="url(#hatch-green)" opacity="0.52"/>
  </g>

  <!-- Section labels -->
  <rect x="88" y="228" width="174" height="52" rx="20" fill="#347eb8" filter="url(#sketchy)"/>
  <text x="175" y="261" text-anchor="middle" class="label-en" font-size="22" font-weight="700" fill="#ffffff">CORE / 基础能力</text>
  <rect x="744" y="204" width="214" height="54" rx="20" fill="#7654b5" filter="url(#sketchy)"/>
  <text x="851" y="238" text-anchor="middle" class="label-en" font-size="22" font-weight="700" fill="#ffffff">AGENT / 智能体层</text>
  <rect x="1287" y="228" width="186" height="52" rx="20" fill="#2d8a55" filter="url(#sketchy)"/>
  <text x="1380" y="261" text-anchor="middle" class="label-en" font-size="22" font-weight="700" fill="#ffffff">TOOL / 工具系统</text>

  <!-- Core cards -->
  <rect x="96" y="320" width="340" height="96" rx="18" fill="#ffffff" stroke="#347eb8" stroke-width="3" filter="url(#sketchy)"/>
  <circle cx="135" cy="368" r="25" fill="#dff0ff" stroke="#347eb8" stroke-width="3" filter="url(#sketchy)"/>
  <text x="135" y="377" text-anchor="middle" class="label-en" font-size="21" font-weight="700" fill="#194f78">M</text>
  <text x="176" y="357" class="label-en" font-size="23" font-weight="700" fill="#194f78">Message</text>
  <text x="176" y="389" font-size="20" fill="#45677f">统一角色、内容与元数据</text>

  <rect x="96" y="456" width="340" height="96" rx="18" fill="#ffffff" stroke="#347eb8" stroke-width="3" filter="url(#sketchy)"/>
  <circle cx="135" cy="504" r="25" fill="#dff0ff" stroke="#347eb8" stroke-width="3" filter="url(#sketchy)"/>
  <text x="135" y="513" text-anchor="middle" class="label-en" font-size="21" font-weight="700" fill="#194f78">C</text>
  <text x="176" y="493" class="label-en" font-size="23" font-weight="700" fill="#194f78">Config</text>
  <text x="176" y="525" font-size="20" fill="#45677f">集中管理运行参数</text>

  <rect x="96" y="592" width="340" height="112" rx="18" fill="#ffffff" stroke="#347eb8" stroke-width="3" filter="url(#sketchy)"/>
  <circle cx="135" cy="648" r="25" fill="#dff0ff" stroke="#347eb8" stroke-width="3" filter="url(#sketchy)"/>
  <text x="135" y="657" text-anchor="middle" class="label-en" font-size="18" font-weight="700" fill="#194f78">LLM</text>
  <text x="176" y="635" class="label-en" font-size="22" font-weight="700" fill="#194f78">HelloAgentsLLM</text>
  <text x="176" y="667" font-size="20" fill="#45677f">普通调用与流式输出</text>

  <!-- Core → AgentBase connections; never filtered. -->
  <path d="M 436 368 C 525 368, 610 338, 705 340" fill="none" stroke="#347eb8" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <path d="M 436 504 C 535 504, 610 390, 705 376" fill="none" stroke="#347eb8" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <path d="M 436 648 C 535 648, 615 442, 705 412" fill="none" stroke="#347eb8" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>

  <!-- Agent layer -->
  <rect x="705" y="306" width="290" height="138" rx="25" fill="#17233c" stroke="#7654b5" stroke-width="5" filter="url(#sketchy)"/>
  <text x="850" y="353" text-anchor="middle" class="label-en" font-size="28" font-weight="700" fill="#ffffff">Agent</text>
  <text x="850" y="390" text-anchor="middle" font-size="24" fill="#e8e0ff">抽象基类</text>
  <text x="850" y="421" text-anchor="middle" font-size="17" fill="#c9bdf0">统一 run · history · config</text>

  <!-- AgentBase → implementations -->
  <path d="M 770 444 C 745 486, 700 512, 677 548" fill="none" stroke="#7654b5" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-purple)"/>
  <path d="M 850 444 L 850 548" fill="none" stroke="#7654b5" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-purple)"/>
  <path d="M 930 444 C 955 486, 1000 512, 1023 548" fill="none" stroke="#7654b5" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-purple)"/>

  <rect x="590" y="560" width="178" height="142" rx="22" fill="#ffffff" stroke="#7654b5" stroke-width="3" filter="url(#sketchy)"/>
  <text x="679" y="610" text-anchor="middle" class="label-en" font-size="21" font-weight="700" fill="#4d3281">SimpleAgent</text>
  <text x="679" y="647" text-anchor="middle" font-size="21" fill="#5a4774">多轮对话</text>
  <text x="679" y="676" text-anchor="middle" font-size="17" fill="#7b6a91">history</text>

  <rect x="761" y="560" width="178" height="142" rx="22" fill="#ffffff" stroke="#7654b5" stroke-width="3" filter="url(#sketchy)"/>
  <text x="850" y="610" text-anchor="middle" class="label-en" font-size="19" font-weight="700" fill="#4d3281">ReflectionAgent</text>
  <text x="850" y="647" text-anchor="middle" font-size="21" fill="#5a4774">反思与改写</text>
  <text x="850" y="676" text-anchor="middle" class="label-en" font-size="13" fill="#7b6a91">Initial → Reflect → Refine</text>

  <rect x="932" y="560" width="178" height="142" rx="22" fill="#ffffff" stroke="#7654b5" stroke-width="3" filter="url(#sketchy)"/>
  <text x="1021" y="610" text-anchor="middle" class="label-en" font-size="21" font-weight="700" fill="#4d3281">ReActAgent</text>
  <text x="1021" y="647" text-anchor="middle" font-size="21" fill="#5a4774">推理与工具调用</text>
  <text x="1021" y="676" text-anchor="middle" class="label-en" font-size="13" fill="#7b6a91">Thought → Action → Obs.</text>

  <!-- Tool cards -->
  <rect x="1252" y="320" width="256" height="92" rx="18" fill="#ffffff" stroke="#2d8a55" stroke-width="3" filter="url(#sketchy)"/>
  <text x="1380" y="360" text-anchor="middle" class="label-en" font-size="23" font-weight="700" fill="#17613a">BaseTool</text>
  <text x="1380" y="389" text-anchor="middle" font-size="19" fill="#315f45">统一 execute 接口</text>

  <rect x="1252" y="472" width="256" height="92" rx="18" fill="#ffffff" stroke="#2d8a55" stroke-width="3" filter="url(#sketchy)"/>
  <text x="1380" y="512" text-anchor="middle" class="label-en" font-size="22" font-weight="700" fill="#17613a">CalculatorTool</text>
  <text x="1380" y="541" text-anchor="middle" font-size="19" fill="#315f45">AST 白名单安全计算</text>

  <rect x="1252" y="624" width="256" height="92" rx="18" fill="#17233c" stroke="#2d8a55" stroke-width="4" filter="url(#sketchy)"/>
  <text x="1380" y="664" text-anchor="middle" class="label-en" font-size="22" font-weight="700" fill="#ffffff">ToolRegistry</text>
  <text x="1380" y="693" text-anchor="middle" font-size="19" fill="#d9f6e4">注册 · 描述 · 执行</text>

  <!-- Tool relations -->
  <path d="M 1380 412 L 1380 462" fill="none" stroke="#2d8a55" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <text x="1402" y="446" font-size="17" fill="#17613a">继承</text>
  <path d="M 1380 564 L 1380 614" fill="none" stroke="#2d8a55" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <text x="1402" y="598" font-size="17" fill="#17613a">注册</text>
  <path d="M 1252 670 C 1190 670, 1165 632, 1120 632" fill="none" stroke="#24324a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
  <text x="1154" y="704" font-size="18" fill="#4d5a70">按名称调用</text>

  <!-- Footer note -->
  <rect x="362" y="805" width="876" height="58" rx="24" fill="#fff4d9" stroke="#d4920a" stroke-width="3" filter="url(#sketchy)"/>
  <text x="800" y="842" text-anchor="middle" font-size="24" font-weight="700" fill="#7a4a08">统一消息 ＋ 可替换模型 ＋ 可注册工具 ＝ 一个能继续长大的 Agent 框架</text>
</svg>
