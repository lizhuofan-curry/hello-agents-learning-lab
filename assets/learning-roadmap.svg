<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
  <title id="title">Hello Agents 学习路线图</title>
  <desc id="desc">从规则启蒙、语言底座、Agent 范式、框架视野到亲手实现 HelloAgents 的五阶段学习路线。</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&amp;family=ZCOOL+KuaiLe&amp;display=swap');
      text { font-family: 'Ma Shan Zheng', 'ZCOOL KuaiLe', 'STKaiti', 'KaiTi', cursive; }
      .label-en { font-family: 'Comic Sans MS', 'Segoe Print', 'Bradley Hand', cursive, sans-serif; }
    </style>
    <filter id="sketchy" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="turbulence" baseFrequency="0.025" numOctaves="4" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#17233c" flood-opacity="0.12"/>
    </filter>

    <pattern id="hatch-orange" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#f1b37a" stroke-width="1.5" opacity="0.34"/>
    </pattern>
    <pattern id="hatch-blue" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#84b8e9" stroke-width="1.5" opacity="0.34"/>
    </pattern>
    <pattern id="hatch-purple" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#b7a2e9" stroke-width="1.5" opacity="0.34"/>
    </pattern>
    <pattern id="hatch-green" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#79bd9b" stroke-width="1.5" opacity="0.34"/>
    </pattern>
    <pattern id="hatch-coral" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#e99a8b" stroke-width="1.5" opacity="0.34"/>
    </pattern>

    <marker id="arrow-navy" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 2 2 L 10 6 L 2 10 Z" fill="#24324a"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#fbfaf6"/>
  <path d="M 56 112 C 250 82, 410 138, 610 102 S 1020 120, 1215 92 S 1430 110, 1545 78"
        fill="none" stroke="#d7deea" stroke-width="3" stroke-dasharray="12 14"/>

  <text x="70" y="82" class="label-en" font-size="22" font-weight="700" fill="#f06b4f" letter-spacing="3">HELLO AGENTS · LEARNING PATH</text>
  <text x="70" y="154" font-size="58" font-weight="700" fill="#17233c">从理解，到创造</text>
  <text x="72" y="204" font-size="25" fill="#5f6b7d">每一章不是终点，而是搭建自己 Agent 框架的一块积木</text>

  <rect x="1280" y="74" width="250" height="64" rx="26" fill="#17233c" filter="url(#sketchy)"/>
  <text x="1405" y="114" text-anchor="middle" class="label-en" font-size="21" font-weight="700" fill="#ffffff">LEARN → BUILD</text>

  <!-- Connectors: intentionally unfiltered so every arrow remains visible. -->
  <path d="M 328 404 C 360 416, 372 486, 407 510" fill="none" stroke="#24324a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
  <path d="M 628 510 C 660 482, 665 397, 700 376" fill="none" stroke="#24324a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
  <path d="M 928 376 C 962 398, 967 490, 1000 514" fill="none" stroke="#24324a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
  <path d="M 1220 514 C 1254 484, 1258 390, 1290 364" fill="none" stroke="#24324a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-navy)"/>

  <!-- Stage 01 -->
  <g filter="url(#shadow)">
    <rect x="70" y="280" width="258" height="248" rx="24" fill="#fff4e7" stroke="#d97922" stroke-width="4" filter="url(#sketchy)"/>
    <rect x="70" y="280" width="258" height="248" rx="24" fill="url(#hatch-orange)" opacity="0.65"/>
  </g>
  <circle cx="104" cy="314" r="24" fill="#d97922" filter="url(#sketchy)"/>
  <text x="104" y="322" text-anchor="middle" class="label-en" font-size="18" font-weight="700" fill="#ffffff">01</text>
  <text x="100" y="374" font-size="34" font-weight="700" fill="#8d3d09">规则启蒙</text>
  <text x="100" y="414" font-size="21" fill="#754423">先看懂“规则”如何</text>
  <text x="100" y="444" font-size="21" fill="#754423">驱动一场对话</text>
  <rect x="98" y="470" width="98" height="36" rx="18" fill="#ffffff" stroke="#d97922" stroke-width="2" filter="url(#sketchy)"/>
  <text x="147" y="494" text-anchor="middle" class="label-en" font-size="18" fill="#8d3d09">ELIZA</text>

  <!-- Stage 02 -->
  <g filter="url(#shadow)">
    <rect x="407" y="394" width="221" height="248" rx="24" fill="#eaf5ff" stroke="#347eb8" stroke-width="4" filter="url(#sketchy)"/>
    <rect x="407" y="394" width="221" height="248" rx="24" fill="url(#hatch-blue)" opacity="0.65"/>
  </g>
  <circle cx="442" cy="429" r="24" fill="#347eb8" filter="url(#sketchy)"/>
  <text x="442" y="437" text-anchor="middle" class="label-en" font-size="18" font-weight="700" fill="#ffffff">02</text>
  <text x="437" y="488" font-size="33" font-weight="700" fill="#194f78">语言底座</text>
  <text x="437" y="528" font-size="20" fill="#335d78">理解文本如何被切分、</text>
  <text x="437" y="558" font-size="20" fill="#335d78">预测与生成</text>
  <text x="437" y="610" class="label-en" font-size="18" font-weight="700" fill="#194f78">N-gram · BPE · Qwen</text>

  <!-- Stage 03 -->
  <g filter="url(#shadow)">
    <rect x="700" y="244" width="228" height="264" rx="24" fill="#f2edff" stroke="#7654b5" stroke-width="4" filter="url(#sketchy)"/>
    <rect x="700" y="244" width="228" height="264" rx="24" fill="url(#hatch-purple)" opacity="0.62"/>
  </g>
  <circle cx="736" cy="280" r="24" fill="#7654b5" filter="url(#sketchy)"/>
  <text x="736" y="288" text-anchor="middle" class="label-en" font-size="18" font-weight="700" fill="#ffffff">03</text>
  <text x="730" y="340" font-size="33" font-weight="700" fill="#4d3281">Agent 范式</text>
  <text x="730" y="382" font-size="20" fill="#5a4774">让模型学会思考、行动、</text>
  <text x="730" y="412" font-size="20" fill="#5a4774">观察与自我修正</text>
  <text x="730" y="462" class="label-en" font-size="17" font-weight="700" fill="#4d3281">ReAct · Plan · Reflection</text>

  <!-- Stage 04 -->
  <g filter="url(#shadow)">
    <rect x="1000" y="394" width="220" height="248" rx="24" fill="#e9f8ef" stroke="#2d8a55" stroke-width="4" filter="url(#sketchy)"/>
    <rect x="1000" y="394" width="220" height="248" rx="24" fill="url(#hatch-green)" opacity="0.62"/>
  </g>
  <circle cx="1036" cy="429" r="24" fill="#2d8a55" filter="url(#sketchy)"/>
  <text x="1036" y="437" text-anchor="middle" class="label-en" font-size="18" font-weight="700" fill="#ffffff">04</text>
  <text x="1030" y="488" font-size="33" font-weight="700" fill="#17613a">框架视野</text>
  <text x="1030" y="528" font-size="20" fill="#315f45">比较协作方式、控制流</text>
  <text x="1030" y="558" font-size="20" fill="#315f45">与工程边界</text>
  <text x="1030" y="604" class="label-en" font-size="16" font-weight="700" fill="#17613a">AutoGen · CAMEL</text>
  <text x="1030" y="628" class="label-en" font-size="16" font-weight="700" fill="#17613a">AgentScope · LangGraph</text>

  <!-- Stage 05 -->
  <g filter="url(#shadow)">
    <rect x="1290" y="224" width="240" height="286" rx="26" fill="#fff0ed" stroke="#d55343" stroke-width="5" filter="url(#sketchy)"/>
    <rect x="1290" y="224" width="240" height="286" rx="26" fill="url(#hatch-coral)" opacity="0.65"/>
  </g>
  <circle cx="1328" cy="262" r="25" fill="#d55343" filter="url(#sketchy)"/>
  <text x="1328" y="270" text-anchor="middle" class="label-en" font-size="18" font-weight="700" fill="#ffffff">05</text>
  <text x="1320" y="323" font-size="33" font-weight="700" fill="#8f3026">亲手创造</text>
  <text x="1320" y="365" font-size="20" fill="#713f3b">把知识变成自己的</text>
  <text x="1320" y="395" font-size="20" fill="#713f3b">可扩展 Agent 框架</text>
  <rect x="1318" y="425" width="186" height="54" rx="20" fill="#17233c" filter="url(#sketchy)"/>
  <text x="1411" y="459" text-anchor="middle" class="label-en" font-size="22" font-weight="700" fill="#ffffff">HelloAgents</text>

  <path d="M 114 742 q 18 -30 36 0 q 18 -30 36 0" fill="none" stroke="#f0ad35" stroke-width="5" stroke-linecap="round"/>
  <text x="210" y="756" font-size="22" fill="#687386">不是收藏概念，而是把每一步都跑通、拆开、再造一遍。</text>
  <path d="M 1390 690 l 12 25 27 3 -20 18 6 27 -25 -13 -24 13 5 -27 -20 -18 28 -3 Z" fill="#ffd166" stroke="#d4920a" stroke-width="3" filter="url(#sketchy)"/>
</svg>
